<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <div id="game-menu">
        <h1 class="menu-title">PIXEL QUEST</h1>
        <button id="start-btn" class="menu-btn" type="button">START GAME</button>
        <button id="credits-btn" class="menu-btn" type="button" aria-expanded="false" aria-controls="credits">CREDITS</button>
        <a href="https://buy.stripe.com/9B6eVfd9E6OC3sr7cEaAw03" target="_blank" rel="noopener noreferrer" class="menu-btn">SUPPORT</a>
        <p id="credits" class="credits" hidden>Made by bxzex. Sprites, levels and sound are part of the <a href="https://github.com/bxzex/pixel-game" target="_blank" rel="noopener noreferrer">open source repo</a>.</p>
      </div>

      <canvas id="game" width="640" height="360"></canvas>

      <div class="dpad" aria-label="Move">
        <button type="button" data-key="arrowup" aria-label="Up" class="dpad-up">&#9650;</button>
        <button type="button" data-key="arrowleft" aria-label="Left" class="dpad-left">&#9664;</button>
        <button type="button" data-key="arrowright" aria-label="Right" class="dpad-right">&#9654;</button>
        <button type="button" data-key="arrowdown" aria-label="Down" class="dpad-down">&#9660;</button>
      </div>

      <section class="quests">
        <div class="quest-box">
          <h2>QUEST LOG</h2>
          <ul id="quest-list" class="quest-list"></ul>
        </div>
        <div class="quest-box">
          <h2>GUIDE: <span id="hud-guide"></span></h2>
          <p id="hud-guide-note" class="guide-note"></p>
        </div>
      </section>
      
      <p class="help">MOVE: WASD / ARROWS</p>
      <p class="copyright">&copy; 2026 <a href="https://bxzex.com" target="_blank" rel="noopener noreferrer">bxzex</a></p>
    </main>
    <script type="module" src="./src/main.js?v=20261003"></script>
  </body>
</html>
